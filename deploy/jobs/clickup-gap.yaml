# One-off Job for hearthctl clickup-gap. Not part of the chart: it runs once,
# by a person, after a backup (see docs/clickup-gap.md).
#
#   sed -e 's#__NAME__#clickup-gap-snapshot-1#' -e 's#__TAG__#2.7.0#' \
#       -e 's#__ARGS__#["clickup-gap", "snapshot"]#' deploy/jobs/clickup-gap.yaml | kubectl apply -f -
#
# The ClickUp token is read from the Secret clickup-import by secretKeyRef and
# is never printed. The rest of the environment is the running Deployment's.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: hearth
  labels:
    app.kubernetes.io/name: hearth-clickup-gap
spec:
  backoffLimit: 0
  # Kept for a day so the undo lines in the log can still be read.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: gap
          image: ghcr.io/embernet-ai/hearth:__TAG__
          command: ["/usr/local/bin/hearthctl"]
          args: __ARGS__
          env:
            - name: CLICKUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clickup-import
                  key: CLICKUP_TOKEN
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hearth
                  key: POSTGRES_PASSWORD
            - name: HEARTH_DATABASE_URL
              value: postgres://hearth:$(POSTGRES_PASSWORD)@postgres:5432/hearth?sslmode=disable
            - name: HEARTH_ENV
              value: production
            - name: HEARTH_PUBLIC_BASE_URL
              value: https://hearth.example.com
            - name: HEARTH_S3_ENDPOINT
              value: hearth-garage:3900
            - name: HEARTH_S3_PUBLIC_ENDPOINT
              value: files.example.com
            - name: HEARTH_S3_BUCKET
              value: hearth
            - name: HEARTH_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hearth-garage-key-hearth
                  key: S3_ACCESS_KEY_ID
            - name: HEARTH_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hearth-garage-key-hearth
                  key: S3_SECRET_ACCESS_KEY
            - name: HEARTH_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: hearth-garage-key-hearth
                  key: S3_REGION
            - name: HEARTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hearth
                  key: ENCRYPTION_KEY
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
