# One-off Job for hearthctl emberops-migrate: Hearth's operational records into EmberOps, keyed on hearth_id, for the
# EmberOps back end (docs/emberops-backend.md, "Rollout"). A person runs it. It is a dry run unless ARGS has no "--dry-run".
# It is idempotent and resumable, so it is run once to carry the records and again just before the switch to carry what was
# written since. It reads the same environment the server will have after the switch (HEARTH_BACKEND=emberops), which is
# why the settings are here and not on the running server. Companies and contacts are left alone: Hearth keeps the CRM and
# the crm sync projects it (HEARTH_EMBEROPS_CRM_PARTIES stays postgres).
#
#   sed -e 's#__NAME__#emberops-migrate-dry-1#' -e 's#__TAG__#2.22.0#' \
#       -e 's#__ARGS__#["emberops-migrate","--dry-run"]#' deploy/jobs/emberops-migrate.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: hearth
  labels:
    app.kubernetes.io/name: hearth-emberops-migrate
spec:
  backoffLimit: 0
  # Kept for a day so the report can still be read.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: emberops-migrate
          image: ghcr.io/embernet-ai/hearth:__TAG__
          command: ["/usr/local/bin/hearthctl"]
          args: __ARGS__
          env:
            - name: HEARTH_BACKEND
              value: emberops
            - name: HEARTH_EMBEROPS_URL
              value: https://ops.example.com
            - name: HEARTH_EMBEROPS_AUDIENCE
              value: emberops
            - name: HEARTH_EMBEROPS_TIMEZONE
              value: America/New_York
            - name: HEARTH_OIDC_CLIENT_ID
              value: hearth
            - name: HEARTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hearth
                  key: OIDC_CLIENT_SECRET
            - name: HEARTH_OIDC_ISSUER
              value: https://vord.example.com/id/realms/fireball
            - name: HEARTH_EMBEROPS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hearth-emberops
                  key: client-id
            - name: HEARTH_EMBEROPS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hearth-emberops
                  key: client-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hearth
                  key: POSTGRES_PASSWORD
            - name: HEARTH_DATABASE_URL
              value: postgres://hearth:$(POSTGRES_PASSWORD)@postgres:5432/hearth?sslmode=disable
            - name: HEARTH_ENV
              value: production
            - name: HEARTH_PUBLIC_BASE_URL
              value: https://hearth.example.com
            - name: HEARTH_S3_ENDPOINT
              value: hearth-garage:3900
            - name: HEARTH_S3_PUBLIC_ENDPOINT
              value: files.example.com
            - name: HEARTH_S3_BUCKET
              value: hearth
            - name: HEARTH_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hearth-garage-key-hearth
                  key: S3_ACCESS_KEY_ID
            - name: HEARTH_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hearth-garage-key-hearth
                  key: S3_SECRET_ACCESS_KEY
            - name: HEARTH_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: hearth-garage-key-hearth
                  key: S3_REGION
            - name: HEARTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hearth
                  key: ENCRYPTION_KEY
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
