{{- if .Values.groupsSync.enabled }}
# Google Workspace group members, kept in step with Hearth teams and departments
# on a schedule. hearthctl groups-sync -apply; docs/groups-sync.md says what it
# does and what it never does (owners, managers and the protect list are never
# touched). No Google key anywhere: the pod trades a Vord client token for a
# Google credential, the way the mail relay does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hearth.fullname" . }}-groups-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
    app.kubernetes.io/component: groups-sync
data:
  groups.json: |
    {{- dict "mappings" .Values.groupsSync.mappings "protect" .Values.groupsSync.protect "remove" .Values.groupsSync.remove | toPrettyJson | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hearth.fullname" . }}-groups-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
    app.kubernetes.io/component: groups-sync
spec:
  schedule: {{ .Values.groupsSync.schedule | quote }}
  # Forbid: two runs at once would race to add and remove the same people.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "hearth.componentSelectorLabels" (dict "root" . "component" "groups-sync") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: groups-sync
              image: {{ include "hearth.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /usr/local/bin/hearthctl
              args:
                - groups-sync
                - -config
                - /etc/hearth/groups.json
                {{- if .Values.groupsSync.apply }}
                - -apply
                {{- end }}
              env:
                - name: HEARTH_GOOGLE_GROUPS_VORD_TOKEN_URL
                  value: {{ .Values.groupsSync.vordTokenUrl | quote }}
                - name: HEARTH_GOOGLE_GROUPS_AUDIENCE
                  value: {{ .Values.groupsSync.audience | quote }}
                - name: HEARTH_GOOGLE_GROUPS_SERVICE_ACCOUNT
                  value: {{ .Values.groupsSync.serviceAccount | quote }}
                - name: HEARTH_GOOGLE_GROUPS_SUBJECT
                  value: {{ .Values.groupsSync.subject | quote }}
                - name: HEARTH_GOOGLE_GROUPS_CLIENT_ID
                  value: {{ .Values.groupsSync.clientId | quote }}
                - name: HEARTH_GOOGLE_GROUPS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.groupsSync.secretName }}
                      key: {{ .Values.groupsSync.clientSecretKey }}
                {{- include "hearth.database.env" . | nindent 16 }}
                - name: HEARTH_PUBLIC_BASE_URL
                  value: {{ .Values.hearth.publicBaseUrl | quote }}
                - name: HEARTH_ENV
                  value: {{ .Values.hearth.env | quote }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /etc/hearth
                  readOnly: true
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: tmp
              emptyDir: {}
            - name: config
              configMap:
                name: {{ include "hearth.fullname" . }}-groups-sync
{{- end }}
