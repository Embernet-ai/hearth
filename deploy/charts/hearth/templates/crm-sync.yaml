{{- if .Values.crmSync.enabled }}
# Hearth's companies and contacts, copied into EmberOps as Customers, Suppliers,
# and Contacts, on a schedule. hearthctl crm-sync, the same command a person runs
# by hand from deploy/jobs/crm-sync.yaml; docs/crm-sync.md says what it does and
# what it never does. Hearth stays the owner of the CRM: this does not turn on
# HEARTH_EMBEROPS_CRM_PARTIES and does not touch HEARTH_BACKEND.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hearth.fullname" . }}-crm-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
    app.kubernetes.io/component: crm-sync
spec:
  schedule: {{ .Values.crmSync.schedule | quote }}
  # Forbid: two runs at once would race to create the same record.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "hearth.componentSelectorLabels" (dict "root" . "component" "crm-sync") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: crm-sync
              image: {{ include "hearth.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /usr/local/bin/hearthctl
              args:
                - crm-sync
                - -write
                {{- if .Values.crmSync.deals }}
                - -deals
                {{- end }}
                {{- if .Values.crmSync.prospects }}
                - -prospects
                {{- end }}
                {{- if .Values.crmSync.timeline }}
                - -timeline
                {{- end }}
              env:
                - name: CRM_SYNC_EMBEROPS_URL
                  value: {{ .Values.crmSync.emberopsUrl | quote }}
                - name: HEARTH_OIDC_ISSUER
                  value: {{ .Values.crmSync.oidcIssuer | quote }}
                - name: CRM_SYNC_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.crmSync.secretName }}
                      key: {{ .Values.crmSync.clientIdKey }}
                - name: CRM_SYNC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.crmSync.secretName }}
                      key: {{ .Values.crmSync.clientSecretKey }}
                {{- include "hearth.database.env" . | nindent 16 }}
                - name: HEARTH_PUBLIC_BASE_URL
                  value: {{ .Values.hearth.publicBaseUrl | quote }}
                - name: HEARTH_ENV
                  value: {{ .Values.hearth.env | quote }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
